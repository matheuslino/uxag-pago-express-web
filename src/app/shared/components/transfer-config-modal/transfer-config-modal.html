<!-- Header -->
<div class="modal-header">
  <h2 class="modal-title">Configurar transferências</h2>
  <button mat-icon-button (click)="onCancel()" class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</div>

<!-- Subtitle -->
<p class="modal-subtitle">Texto complementar que vem abaixo</p>
<div class="lineSeparation"></div>

<!-- Content -->
<mat-dialog-content class="modal-content">
  <form [formGroup]="transferForm" class="transfer-form">

    <!-- Seção da Empresa -->
    <div class="company-section">
      <div class="company-info">
        <div class="company-icon">🏢</div>
        <div>
          <h3>Empresa</h3>
          <p>123 Milhas</p>
        </div>
      </div>
    </div>


    <!-- Configuration Fields -->
    <div class="config-grid">
      <!-- First Row -->
      <div class="config-row">
        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Grátis</mat-label>
          <input matInput type="number" formControlName="gratis" placeholder="Sem definição">
        </mat-form-field>

        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Limite</mat-label>
          <input matInput type="number" formControlName="limite" placeholder="Sem definição">
        </mat-form-field>
      </div>

      <!-- Second Row -->
      <div class="config-row">
        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Fixo</mat-label>
          <input matInput type="number" formControlName="fixo" placeholder="Sem definição">
        </mat-form-field>

        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Taxa</mat-label>
          <input matInput type="number" formControlName="taxa" placeholder="Sem definição">
        </mat-form-field>
      </div>
    </div>
    <div class="lineSeparation"></div>

    <!-- Min/Max Section -->
    <div class="minmax-section">
      <h3 class="section-title">Defina o mínimo e o máximo</h3>
      <p class="section-subtitle">Texto complementar que vem abaixo</p>

      <div class="config-row">
        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Mínimo</mat-label>
          <input matInput type="number" formControlName="minimo" placeholder="Sem definição">
        </mat-form-field>

        <mat-form-field appearance="outline" class="config-field">
          <mat-label>Máximo</mat-label>
          <input matInput type="number" formControlName="maximo" placeholder="Sem definição">
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<div class="lineSeparation"></div>

<!-- Actions -->
<div class="modal-actions">
  <button mat-button (click)="onCancel()" class="cancel-button">
    Cancelar
  </button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!transferForm.valid || isLoading()"
    class="save-button">
    @if (isLoading()) {
    <mat-icon class="loading-icon">refresh</mat-icon>
    }
    Salvar
  </button>
</div>
