<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" class="mobile-sidenav">
    <a routerLink="/dashboard" routerLinkActive="active" class="sidenav-header">
      <img src="assets/images/logo.svg" 
        alt="User" />
    </a>
    <a *ngFor="let item of menuItems" 
       [routerLink]="item.path" 
       (click)="sidenav.close()" 
       routerLinkActive="active-link"
       class="sidenav-link">
      {{ item.label }}
    </a>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="header-container">
      <div class="header-content-wrapper">
        <mat-toolbar class="top-bar">
          <div class="top-bar-content">
            <div class="left-section">
              <button mat-icon-button class="mobile-menu-button" (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
              </button>
              <a routerLink="/dashboard" routerLinkActive="active" class="logo-section">
                <img src="assets/images/logo.svg" 
                  alt="User" />
              </a>
              <nav class="horizontal-nav">
                <button 
                  *ngFor="let item of menuItems" 
                  mat-button 
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  class="nav-item"
                  [class.active]="item.active">
                  {{ item.label }}
                </button>
              </nav>
              <div class="search-bar">
                <div class="search-input-wrapper">
                  <mat-icon>search</mat-icon>
                  <input type="text" placeholder="Busque por algo..." />
                </div>
                <span class="search-shortcut">⌘ F</span>
              </div>
            </div>

            <img src="assets/images/logo.svg" alt="PagoExpress Logo" class="logo mobile-logo" />

            <div class="user-actions">
              <button mat-icon-button class="action-btn">
                <img src="/assets/icons/mensagens_black.svg" alt="message" />
              </button>
              <button mat-icon-button class="action-btn">
                <img src="/assets/icons/notificacao_black.svg" alt="notifications" />
              </button>
              <button class="user-info-button" [matMenuTriggerFor]="userMenu">
                <div class="user-info">
                  <div class="user-avatar">
                    <img src="assets/images/avatar.png" alt="User Avatar" />
                  </div>
                  <div class="user-details">
                    <span class="user-name">{{ userName }}</span>
                    <span class="user-role">{{ userRole }}</span>
                  </div>
                </div>
              </button>
            </div>
          </div>
        </mat-toolbar>
        
        <div class="search-bar-wrapper-mobile">
          <div class="search-bar">
            <div class="search-input-wrapper">
              <mat-icon>search</mat-icon>
              <input type="text" placeholder="Busque por algo..." />
            </div>
            <span class="search-shortcut">⌘ F</span>
          </div>
        </div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-menu #userMenu="matMenu">
  <div class="user-menu-header">
    <div class="user-info-detailed">
      <div class="user-avatar-menu">
        <img src="assets/images/avatar.png" 
              alt="User" />
      </div>
      <div class="user-details">
        <div class="user-name">{{ currentUser.name || 'Antônio Coutinho' }}</div>
        <div class="user-email">{{ currentUser.email || 'antonio@example.com' }}</div>
      </div>
    </div>
  </div>   
  <mat-divider></mat-divider>
  <button class="icon-info-container" routerLink="/perfil">
    <div class="icon-menu">
      <img src="assets/icons/user.svg" alt="user" />
    </div>
    <div class="icon-text-container">
      <span class="icon-title">Meus Dados</span>
      <span class="icon-subtitle">Gerenciar informações pessoais</span>
    </div>
  </button>
  <div class="icon-info-container">
    <div class="icon-menu">
      <img src="assets/icons/settings.svg" alt="settings" />
    </div>
    <div (click)="openModal()" class="icon-text-container">
      <span class="icon-title">Alterar Senha</span>
      <span class="icon-subtitle">Explore outra senha sua</span>
    </div>
  </div>
  <button class="icon-info-container">
    <div class="icon-menu">
      <img src="assets/icons/idioma.svg" alt="idioma" />
    </div>
    <div class="icon-text-container">
      <span class="icon-title">Idioma</span>
      <span class="icon-subtitle">Trocar para outra linguagem</span>
    </div>
  </button>
  <button class="icon-info-container" (click)="logout()">
    <div class="icon-menu">
      <img src="assets/icons/sair.svg" alt="sair" />
    </div>
    <span class="icon-title">Sair</span>
  </button>
</mat-menu>
