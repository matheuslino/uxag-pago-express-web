<mat-toolbar class="header-toolbar">
  <div class="header-content">
    <div class="header-left">
      <a routerLink="/dashboard" routerLinkActive="active" class="logo-section">
        <img src="assets/images/logo.svg" 
          alt="User" />
      </a>
      <nav class="horizontal-nav">
        <button 
          *ngFor="let item of menuItems" 
          mat-button 
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-item"
          [class.active]="item.active">
          {{ item.label }}
        </button>
      </nav>
    </div>
    
    <div class="header-right">
      <div class="search-container">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
          type="text" 
          class="search-input" 
          placeholder="Busque por algo..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()">
      </div>
      
      <button mat-icon-button class="action-btn" (click)="openMessages()">
        <mat-icon>mail_outline</mat-icon>
      </button>
      
      <button mat-icon-button 
              [matMenuTriggerFor]="notificationMenu" 
              class="action-btn">
        <mat-icon [matBadge]="unreadNotifications" 
                  matBadgeColor="warn" 
                  matBadgeSize="small"
                  [matBadgeHidden]="unreadNotifications === 0">
          notifications_none
        </mat-icon>
      </button>
      
      <div class="user-profile" [matMenuTriggerFor]="userMenu">
        <div class="user-avatar">
          <img src="assets/images/avatar.png" 
                alt="User" />
        </div>
        <div class="user-info">
          <div class="user-name">{{ currentUser?.name || 'Antônio Coutinho' }}</div>
          <div class="user-role">{{ currentUser?.role || 'Gerente de Contas' }}</div>
        </div>
      </div>
    </div>
  </div>
</mat-toolbar>

<mat-menu #notificationMenu="matMenu" class="notification-menu">
  <div class="menu-header">
    <h4>Notificações</h4>
  </div>
  <ng-container *ngIf="notifications.length > 0; else noNotifications">
    <button mat-menu-item *ngFor="let notification of notifications" class="notification-item" [class.unread]="!notification.isRead" (click)="markAsRead(notification)">
      <div class="notification-content">
        <h5>{{ notification.title }}</h5>
        <p>{{ notification.message }}</p>
        <small>{{ notification.createdAt | date:'short' }}</small>
      </div>
    </button>
  </ng-container>
  <ng-template #noNotifications>
    <div class="no-notifications">
      <mat-icon>notifications_off</mat-icon>
      <p>Nenhuma notificação</p>
    </div>
  </ng-template>
  <mat-divider></mat-divider>
  <button mat-menu-item class="view-all-btn" (click)="viewAllNotifications()">
    <mat-icon>visibility</mat-icon>
    <span>Ver todas</span>
  </button>
</mat-menu>

<mat-menu #userMenu="matMenu">
  <div class="user-menu-header">
    <div class="user-info-detailed">
      <div class="user-avatar-menu">
        <img src="assets/images/avatar.png" 
              alt="User" />
      </div>
      <div class="user-details">
        <div class="user-name">{{ currentUser?.name || 'Antônio Coutinho' }}</div>
        <div class="user-email">{{ currentUser?.email || 'antonio@example.com' }}</div>
        <div class="user-role">{{ currentUser?.role || 'Gerente de Contas' }}</div>
      </div>
    </div>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/settings/profile"><mat-icon>person</mat-icon><span>Perfil</span></button>
  <button mat-menu-item routerLink="/settings"><mat-icon>settings</mat-icon><span>Configurações</span></button>
  <button mat-menu-item><mat-icon>help</mat-icon><span>Ajuda</span></button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()" class="logout-item">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
