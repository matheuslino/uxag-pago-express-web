<mat-toolbar class="header-toolbar">
  <div class="header-content">
    <!-- Left: Logo/Title -->
    <div class="header-left">
      <div class="logo-section">
        <mat-icon class="logo-icon">account_balance</mat-icon>
        <h2 class="app-title">PagExpress</h2>
      </div>
    </div>
    
    <!-- Center: Horizontal Navigation Menu -->
    <div class="header-center">
      <nav class="horizontal-nav">
        <button 
          *ngFor="let item of menuItems" 
          mat-button 
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-item"
          [class.active]="item.active">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
      </nav>
    </div>
    
    <!-- Right: User Actions -->
    <div class="header-right">
      <!-- Notifications -->
      <button mat-icon-button 
              [matMenuTriggerFor]="notificationMenu" 
              class="notification-btn">
        <mat-icon [matBadge]="unreadNotifications" 
                  matBadgeColor="warn" 
                  matBadgeSize="small"
                  [matBadgeHidden]="unreadNotifications === 0">
          notifications
        </mat-icon>
      </button>
      
      <!-- User Menu -->
      <button mat-icon-button 
              [matMenuTriggerFor]="userMenu" 
              class="user-menu-btn">
        <div class="user-avatar-small">
          <img src="assets/images/user-avatar.png" 
                alt="User"
                (error)="onImageError($event)"
                *ngIf="imageLoaded" />
          <span *ngIf="!imageLoaded" class="avatar-initials">
            {{ getUserInitials() }}
          </span>
        </div>
      </button>
    </div>
  </div>
</mat-toolbar>

<!-- Notification Menu -->
<mat-menu #notificationMenu="matMenu" class="notification-menu">
  <div class="notification-header">
    <h4>Notificações</h4>
  </div>
  <div class="notification-list" *ngIf="notifications.length > 0; else noNotifications">
    <button mat-menu-item 
            *ngFor="let notification of notifications" 
            class="notification-item" 
            [class.unread]="!notification.isRead"
            (click)="markAsRead(notification)">
      <div class="notification-content">
        <h5>{{ notification.title }}</h5>
        <p>{{ notification.message }}</p>
        <small>{{ notification.createdAt | date:'short' }}</small>
      </div>
    </button>
  </div>
  <ng-template #noNotifications>
    <div class="no-notifications">
      <mat-icon>notifications_off</mat-icon>
      <p>Nenhuma notificação</p>
    </div>
  </ng-template>
  <mat-divider></mat-divider>
  <button mat-menu-item class="view-all-btn">
    <mat-icon>visibility</mat-icon>
    <span>Ver todas</span>
  </button>
</mat-menu>

<!-- User Menu -->
<mat-menu #userMenu="matMenu">
  <div class="user-menu-header">
    <div class="user-info">
      <div class="user-avatar-menu">
        <img src="assets/images/user-avatar.png" 
              alt="User"
              (error)="onImageError($event)"
              *ngIf="imageLoaded" />
        <span *ngIf="!imageLoaded" class="avatar-initials">
          {{ getUserInitials() }}
        </span>
      </div>
      <div class="user-details">
        <div class="user-name">Antônio Coutinho</div>
        <div class="user-email">antonio@example.com</div>
      </div>
    </div>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/settings/profile">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </button>
  <button mat-menu-item routerLink="/settings">
    <mat-icon>settings</mat-icon>
    <span>Configurações</span>
  </button>
  <button mat-menu-item>
    <mat-icon>help</mat-icon>
    <span>Ajuda</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()" class="logout-item">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
