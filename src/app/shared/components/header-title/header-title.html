<div class="page-header">
  <div *ngIf="headerInformation && headerInformation.values">
    <div class="page-header-saldo">
      <nav class="breadcrumb" *ngIf="headerInformation && headerInformation.breadcrumb && headerInformation.breadcrumb.length > 0">
        <a 
          *ngFor="let item of headerInformation.breadcrumb; let last = last" 
          [routerLink]="item.path" 
          [class.active]="last"
          class="breadcrumb-item">
          {{ item.label }}
          <span *ngIf="!last" class="separator">/</span>
        </a>
      </nav>
      <hr />
    </div>
  </div>
  <nav class="breadcrumb" *ngIf="headerInformation && !headerInformation.values && headerInformation.breadcrumb && headerInformation.breadcrumb.length > 0">
    <a 
      *ngFor="let item of headerInformation.breadcrumb; let last = last" 
      [routerLink]="item.path" 
      [class.active]="last"
      class="breadcrumb-item">
      {{ item.label }}
      <span *ngIf="!last" class="separator">/</span>
    </a>
  </nav>
  
  <div class="header-content">
    <div *ngIf="headerInformation?.values as values" class="saldo-info">
      <p class="saldo-label">Saldo</p>
      <div class="saldo-value-wrapper">
        <h1 class="saldo-value">{{ values.value }}</h1>
        <mat-icon class="info-icon">info_outline</mat-icon>
      </div>
      <div class="saldo-percentage">
        <mat-icon class="positive-icon">arrow_upward</mat-icon>
        <span>{{ values.percentage }}</span>
      </div>
    </div>
    <div class="header-info">
      <h1 class="page-title" *ngIf="headerInformation && headerInformation.pageTitle">{{ headerInformation.pageTitle }}</h1>
      <p class="page-subtitle" *ngIf="headerInformation && headerInformation.pageSubtitle">{{ headerInformation.pageSubtitle }}</p>
    </div>
    <div class="header-actions" *ngIf="headerInformation && headerInformation.actionButton">
      <button 
        mat-raised-button
        [disabled]="headerInformation.actionButton.disabled"
        [class.inactive]="headerInformation.actionButton.disabled === true"
        class="primary-action-btn"
        (click)="headerInformation.actionButton.onClick()">
        {{ headerInformation.actionButton.actionLabel }}
      </button>
    </div>
  </div>
</div>
