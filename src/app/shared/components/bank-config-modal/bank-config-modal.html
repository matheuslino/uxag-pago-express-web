<div class="modal-header">
  <h2 class="titleModal" mat-dialog-title>Configuração dos bancos</h2>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="paddingLeft">
  <p class="modal-subtitle">Texto complementar que vem abaixo</p>
</div>

<div class="lineSeparation"></div>

<mat-dialog-content class="modal-content">

  <!-- Seção da Empresa -->
  <div class="company-section">
    <div class="company-info">
      <div class="company-icon">🏢</div>
      <div>
        <h3>Empresa</h3>
        <p>{{ selectedCompany()?.name || 'Selecione uma empresa' }}</p>
      </div>
    </div>
  </div>

  <!-- Formulário -->
  <form [formGroup]="bankConfigForm" class="config-form">
    <div class="form-row">
      <mat-form-field appearance="outline" floatLabel="always" class="w-25">
        <mat-label>Pix-in</mat-label>
        <input class="" matInput formControlName="pixIn" placeholder="Digite o banco" />
      </mat-form-field>

      <mat-form-field appearance="outline" floatLabel="always" class="w-25">
        <mat-label>Pix-out</mat-label>
        <input class="" matInput formControlName="pixOut" placeholder="Digite o banco" />
      </mat-form-field>

      <mat-form-field appearance="outline" floatLabel="always" class="w-50">
        <mat-label>Enviar PIX</mat-label>
        <input class="" matInput formControlName="sendPix" placeholder="Digite o banco" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Cartão de crédito</mat-label>
        <input class="" matInput formControlName="creditCard" placeholder="Digite o banco" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Boleto</mat-label>
        <input class="" matInput formControlName="boleto" placeholder="Digite o banco" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="w-50">
        <mat-label>Pagamento de contas</mat-label>
        <input class="" matInput formControlName="boleto" placeholder="Digite o banco" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<div class="lineSeparation">
</div>
<mat-dialog-actions class="modal-actions">
  <button mat-button mat-dialog-close class="buttonCancel">Cancelar</button>
  <button mat-raised-button color="primary"  class="buttonConfirm" (click)="onSave()" [disabled]="bankConfigForm.invalid || isLoading()">
    @if (isLoading()) {
    <mat-spinner diameter="20"></mat-spinner>
    } @else {
    Salvar
    }
  </button>
</mat-dialog-actions>
