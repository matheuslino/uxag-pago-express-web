<div class="recovery-container">
  @if (!isCodeSent) {
    <div class="step-container">
      <div class="recovery-header">
        <h2>Recuperar senha</h2>
        <p>Informe seu email de cadastro</p>
      </div>

      <form [formGroup]="emailForm" (ngSubmit)="sendEmail()">
        <div class="form-field">
          <span class="material-icons">email</span>
          <input formControlName="email" type="email" placeholder="Seu email" />
        </div>
        <button type="submit" class="submit-button" [disabled]="emailForm.invalid">Enviar</button>
      </form>
    </div>
  } @else {
    <div class="step-container">
      <div class="recovery-header">
        <h2>Recuperar senha</h2>
        <p>Para finalizar, insira o código que enviamos para seu email.</p>
      </div>

      <form [formGroup]="codeForm" (ngSubmit)="verifyCode()">
        <div class="code-inputs" [class.error]="hasError">
          <input #input1 formControlName="digit1" (keyup)="moveToNext($event, input2)" type="text" maxlength="1" />
          <input #input2 formControlName="digit2" (keyup)="moveToNext($event, input3)" type="text" maxlength="1" />
          <input #input3 formControlName="digit3" (keyup)="moveToNext($event, input4)" type="text" maxlength="1" />
          <input #input4 formControlName="digit4" (keyup)="moveToNext($event, input5)" type="text" maxlength="1" />
          <input #input5 formControlName="digit5" type="text" maxlength="1" />
        </div>

        @if(hasError) {
          <p class="error-message">Código errado!</p>
        }

        @if(!hasError) {
          <button type="submit" class="submit-button" [disabled]="codeForm.invalid">Entrar</button>
        } @else {
          <button type="button" class="submit-button" (click)="resendCode()">Reenviar código</button>
        }
      </form>
    </div>
  }
</div>
