<div class="login-container">
  <div class="login-header">
    <h2>Acesse sua conta:</h2>
    <p>Área exclusiva para cliente Pago Express</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" >
      <mat-label>Seu email</mat-label>
      <input class="loginInputs" matInput type="email" formControlName="email" />
      <mat-icon matPrefix>email</mat-icon>
      <mat-error class="error">Dados inválidos</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sua senha</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
      />
      <mat-icon matPrefix>lock</mat-icon>
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hidePassword = !hidePassword"
      >
        <mat-icon>{{
          hidePassword ? "visibility_off" : "visibility"
        }}</mat-icon>
      </button>
      <mat-error>Dados inválidos</mat-error>
    </mat-form-field>

    <div class="form-actions">
      <a href="/auth/recovery-password" class="forgot-password-link">Esqueceu a senha?</a>

      <button
        mat-raised-button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
      >
        <mat-icon *ngIf="isLoading">hourglass_empty</mat-icon>
        {{ isLoading ? "Entrando..." : "Entrar" }}
      </button>
    </div>
  </form>
</div>
