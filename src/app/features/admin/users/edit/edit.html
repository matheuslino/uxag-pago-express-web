<app-header-title [headerInformation]="headerInformation"></app-header-title>
<div class="template-content">
  <app-admin-sidebar></app-admin-sidebar>

  <div class="page-wrapper">
    <div class="pix-list-client-info">
      <span class="pix-avatar">
        <img src="/img/house.svg" alt="Avatar">
      </span>
      <div>
        <h2 class="pix-user-name">Usuário</h2>
        <p class="pix-user-role">Adeilton alves junior</p>
      </div>
    </div>


    <div class="page-container">
      <form class="edit-user-form">


        <div class="edit-client-header">
          <h1>Informações do usuário</h1>
          <p>Complete as informações do usuário conforme necessário</p>
        </div>

        <hr />


        <div class="edit-client-section">
          <div class="edit-client-section-title">Dados pessoais</div>
          <div class="edit-client-fields-grid">
            <div class="edit-client-field">
              <label for="cnpj">CNPJ</label>
              <input id="cnpj" type="text" value="26.669.170/0001-57">
            </div>
            <div class="edit-client-field">
              <label for="nome">Nome</label>
              <input id="nome" type="text" value="123 Milhas">
            </div>
            <div class="edit-client-field">
              <label for="telefone">Telefone</label>
              <input id="telefone" type="text" value="(00) 0000-0000">
            </div>
            <div class="edit-client-field">
              <label for="email">E-mail</label>
              <input id="email" type="email" value="adilton.jr@outlook.com">
            </div>
          </div>
        </div>

        <hr />


        <div class="edit-client-section">
          <div class="edit-client-section-title">Dados de credencial</div>
          <div class="edit-client-fields-grid">
            <div class="edit-client-field">
              <label for="login">Login</label>
              <input id="login" type="text" value="adilton.jr@outlook.com" disabled>
            </div>
            <div class="edit-client-field">
              <label for="empresa">Empresa</label>
              <input id="empresa" type="text" value="3 FACES - 44.195.498/0001-24 " disabled>
            </div>
          </div>
        </div>

        <hr />


        <div class="edit-client-section">
          <div class="edit-client-section-title">Dados complementares</div>
          <div class="edit-client-fields-grid">
            <div class="edit-client-field">
              <label for="data-nascimento">País</label>
              <input id="data-nascimento" type="text" value="Brasil">
            </div>
            <div class="edit-client-field">
              <label for="funcao">Perfil</label>
              <input id="funcao" type="text" value="Adeilton alves junior">
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>

</div>
