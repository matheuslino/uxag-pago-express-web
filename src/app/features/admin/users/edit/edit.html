
<div class="page-wrapper">

 
  <div class="pix-list-client-info">
    <span class="pix-avatar">
      <img src="/img/house.svg" alt="Avatar">
    </span>
    <div>
      <h2 class="pix-user-name">Usuário</h2>
      <p class="pix-user-role">Adeilton alves junior</p>
    </div>
  </div>

 
  <div class="page-container">
    <form class="edit-user-form">

     
      <div class="edit-client-header">
        <h1>Informações do usuário</h1>
        <p>Complete as informações do usuário conforme necessário</p>
      </div>

      <hr />

   
      <div class="edit-client-section">
        <div class="edit-client-section-title">Dados pessoais</div>
        <div class="edit-client-fields-grid">
          <div class="edit-client-field">
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" value="123.456.789-00">
          </div>
          <div class="edit-client-field">
            <label for="nome">Nome</label>
            <input id="nome" type="text" value="João da Silva">
          </div>
          <div class="edit-client-field">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="text" value="(11) 99999-9999">
          </div>
          <div class="edit-client-field">
            <label for="email">E-mail</label>
            <input id="email" type="email" value="joao.silva@email.com">
          </div>
        </div>
      </div>

      <hr />

     
      <div class="edit-client-section">
        <div class="edit-client-section-title">Dados de credencial</div>
        <div class="edit-client-fields-grid">
          <div class="edit-client-field">
            <label for="login">Login</label>
            <input id="login" type="text" value="joaosilva">
          </div>
          <div class="edit-client-field">
            <label for="empresa">Empresa</label>
            <input id="empresa" type="text" value="123 Milhas">
          </div>
        </div>
      </div>

      <hr />

     
      <div class="edit-client-section">
        <div class="edit-client-section-title">Dados complementares</div>
        <div class="edit-client-fields-grid">
          <div class="edit-client-field">
            <label for="data-nascimento">Data de nascimento</label>
            <input id="data-nascimento" type="date" value="1990-01-01">
          </div>
          <div class="edit-client-field">
            <label for="funcao">Função</label>
            <input id="funcao" type="text" value="Administrador">
          </div>
        </div>
      </div>

    </form>
  </div>
</div>
