<app-header-title [headerInformation]="headerInformation"></app-header-title>
<div class="template-content">
  <app-relatorios-sidebar [menuSelected]="reportMenu"></app-relatorios-sidebar>
  <div class="template-list-bg">
    <div class="template-list-container">
      <form class="filtros-container" [formGroup]="reportForm">
        <div class="filtro-item">
          <label for="dateInit">Período De</label>
          <input type="date" id="dateInit" formControlName="dateInit">
        </div>
        <div class="filtro-item">
          <label for="dateFinal">Período Até</label>
          <input type="date" id="dateFinal" formControlName="dateFinal">
        </div>
        <div class="filtro-item">
          <label for="razao-social">Razão social</label>
          <input type="text" id="razao-social" formControlName="razaoSocial" placeholder="Digite a razão social">
        </div>
        <div class="filtro-item">
          <label for="carteira">Carteira</label>
          <select id="carteira" formControlName="wallet">
            <option value="">Todas</option>
            <option *ngFor="let wallet of wallets" [value]="wallet">{{ wallet }}</option>
          </select>
        </div>
      </form>

      <div class="resultado-container">
        <div class="resultado-header">
          <div class="resultado-titulo">
            <h2>Resultado da pesquisa</h2>
            <p>Abaixo estão os resultados encontrados</p>
          </div>
          <div class="resultado-total">
            <span>Total {{ registros.length }} registros</span>
          </div>
        </div>

        <div class="tabela-card">
          <div class="tabela-header">
            <span class="coluna-data">Data</span>
            <span class="coluna-total">Total</span>
          </div>
          <div class="tabela-body">
            <div class="tabela-linha" *ngFor="let registro of registros">
              <span class="coluna-data">{{ registro.data }}</span>
              <span class="coluna-total">{{ registro.total }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
