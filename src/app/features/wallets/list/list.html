<app-header-title [headerInformation]="headerInformation"></app-header-title>
<div class="template-content">
  <app-wallet-sidebar></app-wallet-sidebar>
  <div class="template-bg">
    <section class="filters-card">
      <div class="form-group">
        <label for="razaoSocial">Razão Social</label>
        <input
          type="text"
          id="razaoSocial"
          [(ngModel)]="filtroRazaoSocial"
          (ngModelChange)="aplicarFiltros()"
          placeholder="Digite a razão social"
        />
      </div>

      <div class="form-group">
        <label for="numeroCarteira">Número da carteira</label>
        <input
          type="text"
          id="numeroCarteira"
          [(ngModel)]="filtroNumeroCarteira"
          (ngModelChange)="aplicarFiltros()"
          placeholder="Ex: 1234"
        />
      </div>

      <div class="form-group">
        <label for="apelido">Apelido</label>
        <input
          type="text"
          id="apelido"
          [(ngModel)]="filtroApelido"
          (ngModelChange)="aplicarFiltros()"
          placeholder="Ex: Primeira carteira"
        />
      </div>
    </section>

    <section class="results-card">
      <div class="results-header">
        <div>
          <h2>Resultado da pesquisa</h2>
          <p>Abaixo estão os resultados encontrados</p>
        </div>
        <span>Total {{ empresasFiltradas.length }} registros</span>
      </div>

      <div class="results-table">
        <div class="table-header">
          <div>Razão Social</div>
          <div>Número da carteira</div>
          <div>Apelido</div>
          <div class="text-right">Ações</div>
        </div>

        <div class="table-row" *ngFor="let empresa of empresasFiltradas; let i = index">
          <div class="razao-social-cell">
            <strong>{{ empresa.razaoSocial }}</strong>
            <span>{{ empresa.cnpj }}</span>
          </div>
          <div>{{ empresa.numeroCarteira }}</div>
          <div>{{ empresa.apelido }}</div>

          <div class="actions-cell">
            <button class="kebab-menu" (click)="toggleMenu(i, $event)">
              <span>&#8942;</span>
            </button>
            <div class="dropdown-menu" *ngIf="menuAbertoIndex === i">
              <a (click)="editar(empresa)">
                <img src="assets/icons/user_option.svg" alt="user">
                <span>Editar</span>
              </a>
              <a (click)="configurar(empresa)">
                <img src="assets/icons/settings_option.svg" alt="user">
                <span>Configurar</span>
              </a>
              <div class="divider"></div>
              <a (click)="verLogs(empresa)">
                <img src="assets/icons/home_option.svg" alt="user">
                <span>Ver logs</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
