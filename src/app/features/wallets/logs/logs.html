<main class="logs-container">

  <section class="info-card">
    <div class="icon-wrapper">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.25 5.25V4.5H1.5V5.25V12.75V13.5H2.25H15.75H16.5V12.75V5.25V4.5H15.75H2.25ZM2.25 5.25H15.75V12.75H2.25V5.25Z" fill="white" stroke="#5C4896" stroke-width="1.2"></path><path d="M3.75 7.5H6" stroke="#5C4896" stroke-width="1.2" stroke-linecap="round"></path></svg>
    </div>
    <div class="text-wrapper">
      <span class="title">Carteira</span>
      <span class="details">6671 • Default</span>
    </div>
  </section>

  <section class="logs-card">
    <header class="card-header">
      <div class="title-group">
        <h2>Histórico de log</h2>
        <p>Complete as informações de acordo com a texto abaixo</p>
      </div>
    </header>

    <div class="log-list-container">
      <div class="log-list-header">
        <span class="col-horario">Horário</span>
        <span class="col-detalhe">
          Detalhe
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14Z" stroke="#A4A7AE" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10.6667V8" stroke="#A4A7AE" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 5.33329H8.00667" stroke="#A4A7AE" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      @for (log of logHistory; track $index) {
        <div class="log-list-row">
          <div class="col-horario">
            <span class="timestamp">{{ log.timestamp }}</span>
            <span class="date">{{ log.date }}</span>
          </div>
          <div class="col-detalhe">
            <span class="details-title">{{ log.details.title }}</span>
            <span class="details-origin">{{ log.details.origin }}</span>
          </div>
        </div>
      }
    </div>
  </section>

</main>
