<app-header-title [headerInformation]="headerInformation"></app-header-title>
<div class="template-content">
  <app-wallet-sidebar></app-wallet-sidebar>
  <main class="logs-container">
    <section class="info-card">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M200-280v-280h80v280h-80Zm240 0v-280h80v280h-80ZM80-120v-80h800v80H80Zm600-160v-280h80v280h-80ZM80-640v-80l400-200 400 200v80H80Zm178-80h444-444Zm0 0h444L480-830 258-720Z"/></svg>
      </div>
      <div class="text-wrapper">
        <span class="title">Carteira</span>
        <span class="details">6671 • Default</span>
      </div>
    </section>
    <section class="logs-card">
      <header class="card-header">
        <div class="title-group">
          <h2>Histórico de log</h2>
          <p>Complete as informações de acordo com a texto abaixo</p>
        </div>
      </header>
      <div class="log-list-container">
        <div class="log-list-header">
          <span class="col-horario">Horário</span>
          <span class="col-detalhe">
            Detalhe
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
          </span>
        </div>
        @for (log of logHistory; track $index) {
          <div class="log-list-row">
            <div class="col-horario">
              <span class="timestamp">{{ log.timestamp }}</span>
              <span class="date">{{ log.date }}</span>
            </div>
            <div class="col-detalhe">
              <span class="details-title">{{ log.details.title }}</span>
              <span class="details-origin">{{ log.details.origin }}</span>
            </div>
          </div>
        }
      </div>
    </section>
  </main>
</div>
