<div class="dashboard-container">
  <h1>Dashboard</h1>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openBankConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar Bancos - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openTransactionConfigModal()">
      <mat-icon>tune</mat-icon>
      Configuração Transações - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openTransferConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar transferências - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openWalletTransferConfigModal1()">
      <mat-icon>settings</mat-icon>
      Configurar transferência de carteira 1 - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openWalletTransferConfigModal2()">
      <mat-icon>settings</mat-icon>
      Configurar transferência de carteira 2 - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openIntegrationConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar senha de integrações - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openPixLimitModal()">
      <mat-icon>settings</mat-icon>
      Configurar Limite de valores (PIX) - ok
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openConfigIpsModal()">
      <mat-icon>settings</mat-icon>
      Configurar ips - Ok
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openLimitConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar limite de valores de Saque - Ok
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openLimitSaqConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar limite de valores de pagamento - Ok
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openEmailConfigModal()">
      <mat-icon>settings</mat-icon>
      Configurar e-mail tecnico - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="certificateModal()">
      <mat-icon>settings</mat-icon>
      Configurar certificado digital - OK
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openTaxasPixModal()">
      <mat-icon>settings</mat-icon>
      Configurar taxas pix - Ok
    </button>
  </mat-card-actions>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="openTaxaSaqueModal()">
      <mat-icon>settings</mat-icon>
      Configurar taxas saque -  Ok
    </button>
  </mat-card-actions>
